<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Address Book ${addressBookId}|">Address Book</title>
</head>
<body>
    <h1 th:text="|Address Book ${addressBookId}|">Address Book</h1>

    <nav aria-label="Main navigation">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/addressbooks}">Address books</a>
        <a th:href="@{/buddies}">Buddies</a>
    </nav>

    <p th:if="${#lists.isEmpty(buddies)}">No buddies yet</p>

    <table th:unless="${#lists.isEmpty(buddies)}">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Phone number</th>
                <th scope="col">Address</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="buddy : ${buddies}">
                <td th:text="${buddy.name}"></td>
                <td th:text="${buddy.phoneNumber}"></td>
                <td th:text="${buddy.address}"></td>
            </tr>
        </tbody>
    </table>

    <h2>Add a buddy</h2>
    <form th:action="@{/addressbooks/{id}/buddies(id=${addressBookId})}"
          th:object="${buddy}" method="post">
        <p>
            <label for="name">Name</label>
            <input type="text" th:field="*{name}" required>
        </p>
        <p>
            <label for="phoneNumber">Phone number</label>
            <input type="tel" th:field="*{phoneNumber}" required>
        </p>
        <p>
            <label for="address">Address</label>
            <input type="text" th:field="*{address}">
        </p>
        <button type="submit">Add buddy</button>
    </form>
</body>
</html>
